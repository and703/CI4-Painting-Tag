        <!-- Script -->
        <script>
        $(document).ready(function(){

            // Datapicker 
            $( ".datepicker" ).datepicker({
                "dateFormat": "yy-mm-dd",
                changeYear: true
            });

            // DataTable
            var dataTable = $('#empTable').DataTable({
                lengthMenu: [
                    [10, 100, 500, 1000, 5000, 10000],
                    [10, 100, 500, 1000, 5000, 10000],
                ],
                'processing': true,
                'serverSide': true,
                'serverMethod': 'post',
                'searching': true, // Set false to remove default Search Control
                'ajax': {
                    'url':'ajaxfile.php',
                    'data': function(data){
                        // Read values
                        var from_date = $('#search_fromdate').val();
                        var to_date = $('#search_todate').val();
                        var Shift = $('#Shift').val();
                        var MCH = $('#MCH').val();
                        var Park = $('#Park').val();
                        var IP_CODE = $('#IP_CODE').val();

                        // Append to data
                        data.searchByFromdate = from_date;
                        data.searchByTodate = to_date;
                        data.searchShift = Shift;
                        data.searchMCH = MCH;
                        data.searchPark = Park;
                        data.searchIP_CODE = IP_CODE;
                    }
                },
                'footerCallback': function(row, data, start, end, display) {
                    var api = this.api(),
                        data;

                    // Remove the formatting to get integer data for summation
                    var intVal = function(i) {
                        return typeof i === 'string' ?
                            i.replace(/[\,]/g, '') * 1 :
                            typeof i === 'number' ?
                            i : 0;
                    };

                    // Total over all pages
                    total = api
                        .column(api.colReorder.transpose(4))
                        .data()
                        .reduce(function(a, b) {
                            return intVal(a) + intVal(b);
                        }, 0);

                    // Total over this page
                    pageTotal = api
                        .column(api.colReorder.transpose(3), {
                            page: 'current'
                        })
                        .data()
                        .reduce(function(a, b) {
                            return intVal(a) + intVal(b);
                        }, 0);

                    // Update footer
                    $(api.column(api.colReorder.transpose(3)).footer()).html(
                        + pageTotal + '   Total'
                    );
                },
                'columns': [
                    { data: 'MCH' },
                    { data: 'IP_CODE' },
                    { data: 'MAT_DESC' },
                    { data: 'AMOUNT' },
                    { data: 'SLOT' },
                    { data: 'PRINT_OUT' },
                    { data: 'USERNAME' },
                    { data: 'GROUP_PAINT' },
                    { data: 'SHIFT' },
                ]
            });

            // Search button
            $('#btn_search').click(function(){
                dataTable.draw();
            });
           
        });
        </script>
