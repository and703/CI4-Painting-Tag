<!doctype html>
<html>
    <head>
    <title>Data Report Painting Print</title>
    <link rel="stylesheet" type="text/css" href="../report_paint/jquery-ui.min.css"/>
    <link rel="stylesheet" type="text/css" href="../report_paint/DataTables/datatables.min.css"/>
    <link rel="stylesheet" href="../template/datatables/bootstrap.min.css">
    <link rel="stylesheet" href="../template/plugins/fontawesome-free/css/all.min.css">
    <script type="text/javascript" src="../report_paint/DataTables/datatables.min.js"></script>
    <script type="text/javascript" src="../report_paint/jquery-ui.min.js"></script>
    <style>
        .container { margin-top: 30px; }
        .card { border: 1px solid #ddd; border-radius: 4px; }
        .card-header { background: #f5f5f5; padding: 12px 15px; font-weight: bold; font-size: 16px; border-bottom: 1px solid #ddd; }
        .card-body { padding: 15px; }
        .filter-row { margin-bottom: 15px; }
        .filter-row td { padding: 5px; }
        .filter-row label { margin-right: 5px; font-weight: 600; }
        hr { margin: 15px 0; border: 0; border-top: 1px solid #ddd; }
    </style>
    </head>
    <body >
    <div class="container">
        <div class="card">
            <div class="card-header">GT Painting RePrint Report</div>
            <div class="card-body">
                <table>
                    <tr>
                        <td>
                            <input type='text' readonly id='search_fromdate' class="datepicker" placeholder='From date'>
                        </td>
                        <td>
                            <input type='text' readonly id='search_todate' class="datepicker" placeholder='To date'>
                        </td>
                        <td>
                            <input type='text' id='Shift' placeholder='Shift'>
                        </td>
                        <td>
                            <input type='text' id='MCH' placeholder='Machine'>
                        </td>
                        <td>
                            <input type='text' id='Park' placeholder='Park'>
                        </td>
                        <td>
                            <input type='button' id="btn_search" value="Filter">
                        </td>
                    </tr>
                </table>
                
                <!-- Table -->
                <table id='empTable' class='display dataTable'>
                    <thead>
                        <tr rowspan="2" style="border: 1px;">
                            <td colspan="2">EVOLUZIONE TYRES</td>
                            <td colspan="7">FORM REPORT BOIACCA</td>
                            <td colspan="2">
                                Doc. No.        : CR-F-024-0820 <br>
                                Rev.            : 00
                            </td>
                        </tr>
                        <tr>
                            <th>Machine</th>
                            <th>IP Code</th>
                            <th>Material Deskripsi</th>
                            <th>Jumlah</th>
                            <th>Slot</th>
                            <th>Trolley</th>
                            <th>Print Out</th>
                            <th>Operator</th>
                            <th>Group</th>
                            <th>Shift</th>
                            <th>REBoiacca</th>
                        </tr>
                    </thead>
                    <tfoot>
                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                    </tfoot>
                    
                </table>
            </div>
        </div>
    </div>
</div>
        
        <!-- Script -->
        <script>
        $(document).ready(function(){

            // Datapicker 
            $( ".datepicker" ).datepicker({
                "dateFormat": "yy-mm-dd",
                changeYear: true
            });

            // DataTable
            var dataTable = $('#empTable').DataTable({    
                lengthMenu: [
                    [10, 100, 500, 1000, 5000, 10000],
                    [10, 100, 500, 1000, 5000, 10000],
                ],
                'processing': true,
                'serverSide': true,
                'serverMethod': 'post',
                'searching': true, // Set false to remove default Search Control
                dom: 'Blfrtip',
                buttons: [{
                        text: '<span class="fas fa-sync-alt"></span> Refresh',
                        className: "btn btn-light btn-sm",
                        action: function(e, dt, node, config) {
                            reload_table();
                        }
                    },
                    {
                        extend: 'excelHtml5',
                        exportOptions: {
                            columns: [0, 1, 2, 3, 4, 5, 6, 7, 8]
                        },
                        footer: true,
                        text: '<span class="fas fa-file-excel"></span> Download Excell',
                        className: "btn btn-light btn-sm",
                        title: 'Report Output Boiacca',
                        filename: 'painting_report'
                    },
                ],
                'ajax': {
                    'url':'ajaxfile.php',
                    'data': function(data){
                        // Read values
                        var from_date = $('#search_fromdate').val();
                        var to_date = $('#search_todate').val();
                        var Shift = $('#Shift').val();
                        var MCH = $('#MCH').val();
                        var Park = $('#Park').val();

                        // Append to data
                        data.searchByFromdate = from_date;
                        data.searchByTodate = to_date;
                        data.searchShift = Shift;
                        data.searchMCH = MCH;
                        data.searchPark = Park;
                    }
                },
                'footerCallback': function(row, data, start, end, display) {
                    var api = this.api();
                    var data;

                    var intVal = function(i) {
                        return typeof i === 'string' ?
                            i.replace(/[\,]/g, '') * 1 :
                            typeof i === 'number' ?
                            i : 0;
                    };

                    var pageData = api.rows({page: 'current'}).data();
                    var totalNormal = 0, totalRe = 0;
                    for (var i = 0; i < pageData.length; i++) {
                        var d = pageData[i];
                        if (d.RE == null || d.RE == 0) {
                            totalNormal += intVal(d.AMOUNT);
                        } else {
                            totalRe += intVal(d.AMOUNT);
                        }
                    }

                    $(api.column(2).footer()).html(totalNormal + ' (Normal)');
                    $(api.column(3).footer()).html(totalRe + ' (RE)');
                    $(api.column(4).footer()).html((totalNormal - totalRe) + ' (Total)');
                },
                'columns': [
                    { data: 'MCH' },
                    { data: 'IP_CODE' },
                    { data: 'MAT_DESC' },
                    { data: 'AMOUNT' },
                    { data: 'SLOT' },
                    { data: 'TROLLEY' },
                    { data: 'PRINT_OUT' },
                    { data: 'USERNAME' },
                    { data: 'GROUP_PAINT' },
                    { data: 'SHIFT' },
                    { data: 'RE' },
                ]
            });

            // Search button
            $('#btn_search').click(function(){
                dataTable.draw();
            });
        });
        </script>
    </body>

</html>
